<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - LifeLine Blood Bank</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/pages.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Outfit:wght@400;600;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
</head>
<!--/*
  Shown when something is asked for that does not exist - a mistyped URL, or an id that has been
  removed. Reached two ways: CustomErrorController for a URL that matches no route, and
  GlobalExceptionHandler for a ResourceNotFoundException thrown out of a controller.

  It uses the normal header and footer on purpose. An error page that looks like a different site
  makes people think they have ended up somewhere they should not be.
*/-->
<body>
<!--/*
  "user" has to reach here or the header would render as signed out. Neither of the two routes
  above gets it from CurrentUserAdvice, so both supply it themselves.
*/-->
<div th:replace="~{fragments/header :: header(user=${user})}"></div>
<main class="page-shell">
    <section class="surface-card error-card">
        <div class="error-code">404</div>
        <h1>We couldn’t find that page.</h1>
        <!--/*
          Uses the supplied message when there is one, and falls back otherwise. It usually is
          empty: Spring Boot withholds exception text from error pages by default, since it can
          leak internals.
        */-->
        <p th:text="${!#strings.isEmpty(message) ? message : 'The page may have moved or the address may be incorrect.'}">
            The page may have moved or the address may be incorrect.
        </p>
        <a class="btn-primary" th:href="@{/home}"><i class="fa-solid fa-house"></i> Return home</a>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
