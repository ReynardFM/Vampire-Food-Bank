<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Requests - LifeLine Blood Bank</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/pages.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Outfit:wght@400;600;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
</head>
<!--/*
  A donor's own requests, and how they were decided.

  Scoped to whoever is signed in - the controller queries by the current user, so this never shows
  anyone else's. The equivalent admin view of every request is admin/request-list.
*/-->
<body>
<div th:replace="~{fragments/header :: header(user=${user})}"></div>

<main class="page-shell">
    <div class="page-heading">
        <div>
            <div class="eyebrow">My activity</div>
            <h1>My Blood Requests</h1>
            <p>Every request you have raised, and how it was decided.</p>
        </div>
        <a class="btn-primary" th:href="@{/requests/create}">
            <i class="fa-solid fa-plus"></i> New request
        </a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <section class="surface-card table-wrap">
        <table class="data-table">
            <thead>
            <tr>
                <th th:replace="~{fragments/sort :: sortable('Date', 'requestDate', ${sort}, ${dir}, '/requests/list')}"></th>
                <th th:replace="~{fragments/sort :: sortable('Blood', 'requestedBloodGroup', ${sort}, ${dir}, '/requests/list')}"></th>
                <th th:replace="~{fragments/sort :: sortable('Units', 'unitsNeeded', ${sort}, ${dir}, '/requests/list')}"></th>
                <th th:replace="~{fragments/sort :: sortable('Hospital', 'hospitalName', ${sort}, ${dir}, '/requests/list')}"></th>
                <th th:replace="~{fragments/sort :: sortable('Urgency', 'urgencyLevel', ${sort}, ${dir}, '/requests/list')}"></th>
                <th th:replace="~{fragments/sort :: sortable('Status', 'status', ${sort}, ${dir}, '/requests/list')}"></th>
                <!--/* Not sortable - there is nothing to order a column of buttons by. */-->
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(requests)}">
                <td class="empty-state" colspan="7">
                    <i class="fa-regular fa-folder-open"></i> You haven't raised any requests yet.
                </td>
            </tr>
            <tr th:each="req : ${requests}">
                <!--/*
                  #temporals is Thymeleaf's date helper. Without it a LocalDateTime prints in its
                  raw form, including the time to the nanosecond.
                */-->
                <td th:text="${#temporals.format(req.requestDate, 'MMM d, yyyy')}">Jul 28, 2026</td>
                <td><span class="badge badge-blood" th:text="${req.requestedBloodGroup.displayName}">A+</span></td>
                <td th:text="${req.unitsNeeded}">1</td>
                <td th:text="${req.hospitalName}">Hospital</td>
                <td th:text="${req.urgencyLevel}">HIGH</td>
                <td>
                    <!--/*
                      One badge deriving its colour from the status name, the same way
                      admin/request-list does it. A new status would style itself.
                    */-->
                    <span class="badge"
                          th:classappend="${'badge-' + #strings.toLowerCase(req.status.name())}"
                          th:text="${req.status}">PENDING</span>
                </td>
                <td>
                    <!--/*
                      No "from" parameter, unlike the admin listings. This is the donor's own list,
                      so the detail page's default of "Back to my requests" is already correct.
                    */-->
                    <a class="btn-secondary" th:href="@{/requests/{id}(id=${req.id})}">View</a>
                </td>
            </tr>
            </tbody>
        </table>
    </section>

    <nav th:replace="~{fragments/pagination :: pager(${page}, ${sort}, ${dir}, '/requests/list')}"></nav>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
