<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Requests - LifeLine Blood Bank</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Outfit:wght@400;600;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header(user=${user})}"></div>

<div class="form_container" style="flex-direction: column; align-items: center; padding-top: 30px;">
    <div th:if="${success}" class="alert alert-success" style="width: 80%;" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" style="width: 80%;" th:text="${error}"></div>

    <div class="login_panel" style="width: 80%; border-radius: 25px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="font-size: 24px;"><i class="fa-solid fa-list-ul" style="color: #d62929; margin-right: 10px;"></i>My Blood Requests</h2>
            <a th:href="@{/requests/create}" style="padding: 10px 20px; background: #d62929; color: white; border-radius: 45px; text-decoration: none; font-weight: 600;">
                <i class="fa-solid fa-plus"></i> New Request
            </a>
        </div>

        <table style="width: 100%; text-align: left; border-collapse: collapse; font-family: 'Outfit', sans-serif;">
            <thead>
            <tr style="border-bottom: 2px solid #ddd;">
                <th style="padding: 12px 8px; color: #555;">Date</th>
                <th style="padding: 12px 8px; color: #555;">Blood Group</th>
                <th style="padding: 12px 8px; color: #555;">Units</th>
                <th style="padding: 12px 8px; color: #555;">Hospital</th>
                <th style="padding: 12px 8px; color: #555;">Urgency</th>
                <th style="padding: 12px 8px; color: #555;">Status</th>
                <th style="padding: 12px 8px; color: #555;">Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(requests)}">
                <td colspan="7" style="padding: 20px 8px; color: #888; text-align: center; font-style: italic;">
                    You haven't made any requests yet.
                </td>
            </tr>
            <tr th:each="req : ${requests}" style="border-bottom: 1px solid #eee;">
                <!-- Formatting the LocalDateTime object -->
                <td style="padding: 15px 8px;" th:text="${#temporals.format(req.requestDate, 'yyyy-MM-dd')}"></td>
                <td style="padding: 15px 8px; font-weight: bold; color: #d62929;" th:text="${req.requestedBloodGroup.displayName}"></td>
                <td style="padding: 15px 8px;" th:text="${req.unitsNeeded}"></td>
                <td style="padding: 15px 8px;" th:text="${req.hospitalName}"></td>
                <td style="padding: 15px 8px;" th:text="${req.urgencyLevel}"></td>
                <td style="padding: 15px 8px;">
                    <!-- Status Badges -->
                    <span th:if="${req.status.name() == 'PENDING'}" style="background: #fff3cd; color: #856404; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: 600;">PENDING</span>
                    <span th:if="${req.status.name() == 'APPROVED'}" style="background: #d4edda; color: #155724; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: 600;">APPROVED</span>
                    <span th:if="${req.status.name() == 'REJECTED'}" style="background: #f8d7da; color: #721c24; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: 600;">REJECTED</span>
                    <span th:if="${req.status.name() == 'FULFILLED'}" style="background: #cce5ff; color: #004085; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: 600;">FULFILLED</span>
                </td>
                <td style="padding: 15px 8px;">
                    <a th:href="@{/requests/{id}(id=${req.id})}" style="color: #222; text-decoration: underline; font-size: 14px;">View</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
