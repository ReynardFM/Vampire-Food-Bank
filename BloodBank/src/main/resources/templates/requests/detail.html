<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Details - LifeLine Blood Bank</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Outfit:wght@400;600;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
</head>
<!--/*
  One request in full, shared by donors and administrators.

  Because both reach it, the controller decides where "Back" goes and passes backUrl and backLabel
  in. The page never works that out itself, and never takes a URL from the query string - doing so
  would let a crafted link redirect someone off-site.

  Read-only. Approving and rejecting live on the pending queue, not here.
*/-->
<body>
<div th:replace="~{fragments/header :: header(user=${user})}"></div>

<div class="form_container" style="justify-content: center; padding-top: 30px;">
    <div class="login_panel" style="width: 60%; border-radius: 25px; padding: 40px; box-shadow: 0 12px 35px rgba(0, 0, 0, 0.1);">

        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 25px;">
            <h2 style="font-size: 24px; color: #222;">
                <i class="fa-solid fa-circle-info" style="color: #d62929; margin-right: 10px;"></i>Request #<span th:text="${request.id}"></span>
            </h2>
            <!--/*
              Four separate th:if blocks, one per status, because each carries its own inline
              colours. The listing pages do this in one line by deriving a CSS class from the
              status name - worth copying here if this page is ever moved onto pages.css.
            */-->
            <div>
                <span th:if="${request.status.name() == 'PENDING'}" style="background: #fff3cd; color: #856404; padding: 6px 12px; border-radius: 12px; font-size: 14px; font-weight: 600;">PENDING</span>
                <span th:if="${request.status.name() == 'APPROVED'}" style="background: #d4edda; color: #155724; padding: 6px 12px; border-radius: 12px; font-size: 14px; font-weight: 600;">APPROVED</span>
                <span th:if="${request.status.name() == 'REJECTED'}" style="background: #f8d7da; color: #721c24; padding: 6px 12px; border-radius: 12px; font-size: 14px; font-weight: 600;">REJECTED</span>
                <span th:if="${request.status.name() == 'FULFILLED'}" style="background: #cce5ff; color: #004085; padding: 6px 12px; border-radius: 12px; font-size: 14px; font-weight: 600;">FULFILLED</span>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div>
                <p style="color: #777; font-size: 14px; margin-bottom: 4px;">Requested Blood Group</p>
                <p style="font-size: 20px; font-weight: 700; color: #d62929;" th:text="${request.requestedBloodGroup.displayName}"></p>
            </div>
            <div>
                <p style="color: #777; font-size: 14px; margin-bottom: 4px;">Units Needed</p>
                <p style="font-size: 20px; font-weight: 700; color: #222;" th:text="${request.unitsNeeded} + ' Units'"></p>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div>
                <p style="color: #777; font-size: 14px; margin-bottom: 4px;">Urgency Level</p>
                <p style="font-size: 16px; font-weight: 600; color: #222;" th:text="${request.urgencyLevel}"></p>
            </div>
            <div>
                <p style="color: #777; font-size: 14px; margin-bottom: 4px;">Date Submitted</p>
                <p style="font-size: 16px; font-weight: 600; color: #222;" th:text="${#temporals.format(request.requestDate, 'yyyy-MM-dd HH:mm')}"></p>
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <p style="color: #777; font-size: 14px; margin-bottom: 4px;">Hospital Name</p>
            <p style="font-size: 16px; font-weight: 600; color: #222;" th:text="${request.hospitalName}"></p>
        </div>

        <div style="margin-bottom: 20px;">
            <p style="color: #777; font-size: 14px; margin-bottom: 4px;">Hospital Address</p>
            <p style="font-size: 16px; font-weight: 600; color: #222;" th:text="${request.hospitalAddress}"></p>
        </div>

        <!--/* Notes are the only optional field on a request, so the whole block is conditional. */-->
        <div style="margin-bottom: 30px;" th:if="${request.notes != null and !request.notes.isEmpty()}">
            <p style="color: #777; font-size: 14px; margin-bottom: 4px;">Additional Notes</p>
            <p style="font-size: 15px; color: #442222; background: #fdfdfe; padding: 12px; border: 1px solid #eee; border-radius: 8px;" th:text="${request.notes}"></p>
        </div>

        <div style="display: flex; justify-content: flex-start; gap: 15px;">
            <a th:href="@{${backUrl}}" style="padding: 12px 25px; background: #e9ecef; color: #333; border-radius: 45px; text-decoration: none; font-weight: 600;">
                <i class="fa-solid fa-arrow-left"></i> <span th:text="${backLabel}">Back to List</span>
            </a>
        </div>

    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
