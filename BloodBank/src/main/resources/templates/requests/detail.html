<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Details - LifeLine Blood Bank</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/pages.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Outfit:wght@400;600;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
</head>
<!--/*
  One request in full, shared by donors and administrators.

  Because both reach it, the controller decides where "Back" goes and passes backUrl and backLabel
  in. The page never works that out itself, and never takes a URL from the query string - doing so
  would let a crafted link redirect someone off-site.

  Read-only. Approving and rejecting live on the pending queue, not here.
*/-->
<body>
<div th:replace="~{fragments/header :: header(user=${user})}"></div>

<main class="page-shell">
    <div class="page-heading">
        <div>
            <div class="eyebrow">Blood request</div>
            <h1>Request #<span th:text="${request.id}">12</span></h1>
            <!--/*
              One badge deriving its colour from the status name, rather than the four separate
              blocks this page used to carry.
            */-->
            <span class="badge"
                  th:classappend="${'badge-' + #strings.toLowerCase(request.status.name())}"
                  th:text="${request.status}">PENDING</span>
        </div>
        <a class="btn-secondary" th:href="@{${backUrl}}">
            <i class="fa-solid fa-arrow-left"></i> <span th:text="${backLabel}">Back to list</span>
        </a>
    </div>

    <section class="surface-card">
        <!--/*
          A description list, because that is exactly what these are: a term and its value. The
          .detail-item wrapper keeps each pair together as one grid cell.
        */-->
        <dl class="detail-grid">
            <div class="detail-item">
                <dt>Requested blood group</dt>
                <dd class="accent" th:text="${request.requestedBloodGroup.displayName}">A+</dd>
            </div>

            <!--/*
              Progress rather than just the figure asked for. A request needing five units may have
              had two collected, and until this was shown there was no way to tell from any screen.
              unitsCollected is summed on demand by the controller.
            */-->
            <div class="detail-item">
                <dt>Units</dt>
                <dd th:text="${unitsCollected} + ' of ' + ${request.unitsNeeded} + ' collected'">0 of 2 collected</dd>
                <p class="field-hint" style="color: #d62929; font-weight: 600;"
                   th:if="${unitsCollected < request.unitsNeeded and request.status.name() == 'APPROVED'}"
                   th:text="${request.unitsNeeded - unitsCollected} + ' still needed'">2 still needed</p>
            </div>

            <div class="detail-item">
                <dt>Urgency level</dt>
                <dd th:text="${request.urgencyLevel}">HIGH</dd>
            </div>

            <div class="detail-item">
                <dt>Date submitted</dt>
                <dd th:text="${#temporals.format(request.requestDate, 'MMM d, yyyy · HH:mm')}">Jul 28, 2026 · 09:00</dd>
            </div>

            <div class="detail-item wide">
                <dt>Hospital</dt>
                <dd>
                    <span th:text="${request.hospitalName}">Toronto General Hospital</span><br>
                    <span class="field-hint" th:text="${request.hospitalAddress}">200 Elizabeth Street, Toronto, ON</span>
                </dd>
            </div>

            <!--/* Notes are the only optional field on a request, so the whole pair is conditional. */-->
            <div class="detail-item wide" th:if="${request.notes != null and !request.notes.isEmpty()}">
                <dt>Additional notes</dt>
                <dd th:text="${request.notes}">Scheduled surgery on Friday.</dd>
            </div>
        </dl>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
