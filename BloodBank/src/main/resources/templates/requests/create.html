<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Blood - LifeLine Blood Bank</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/pages.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Outfit:wght@400;600;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
</head>
<!--/*
  Raising a blood request. Any signed-in account can, donor or administrator.

  Nothing here sets who is requesting or what status it starts in. The controller takes the
  requester from the session and the entity defaults the status to PENDING, so neither can be
  chosen by editing the posted data.
*/-->
<body>
<div th:replace="~{fragments/header :: header(user=${user})}"></div>

<main class="page-shell">
    <div class="page-heading">
        <div>
            <div class="eyebrow">Blood request</div>
            <h1>Request Blood</h1>
            <p>
                Tell us what the patient needs and where. An administrator reviews every request
                before donors are contacted.
            </p>
        </div>
        <a class="btn-secondary" th:href="@{/requests/list}">
            <i class="fa-solid fa-arrow-left"></i> My requests
        </a>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <section class="surface-card">
        <form th:action="@{/requests/create}" th:object="${requestDto}" method="post">
            <!--/*
              form-grid lays the fields out in columns that collapse on a narrow screen. "full" on a
              form-field makes it span the whole width, which is what the address and notes need.
            */-->
            <div class="form-grid">
                <div class="form-field">
                    <label for="requestedBloodGroup">Blood group needed</label>
                    <select id="requestedBloodGroup" th:field="*{requestedBloodGroup}" required>
                        <option value="">Select blood group</option>
                        <!--/*
                          Built from the enum rather than typed out, so the list can never fall out
                          of step with the values the application actually accepts.
                        */-->
                        <option th:each="bg : ${bloodGroups}" th:value="${bg}" th:text="${bg.displayName}"></option>
                    </select>
                    <span class="field-error" th:if="${#fields.hasErrors('requestedBloodGroup')}" th:errors="*{requestedBloodGroup}"></span>
                </div>

                <!--/*
                  A unit is the standard collection, not an arbitrary number - saying so here means
                  the figure can be entered with some idea of what it represents. Kept as a whole
                  count rather than a volume because that is how blood is actually collected and
                  issued, and because units needed and units collected are compared directly.
                */-->
                <div class="form-field">
                    <label for="unitsNeeded">Units needed</label>
                    <input id="unitsNeeded" type="number" th:field="*{unitsNeeded}" min="1" required>
                    <span class="field-hint">One unit is a standard collection of about 450 mL.</span>
                    <span class="field-error" th:if="${#fields.hasErrors('unitsNeeded')}" th:errors="*{unitsNeeded}"></span>
                </div>

                <div class="form-field">
                    <label for="urgencyLevel">Urgency level</label>
                    <select id="urgencyLevel" th:field="*{urgencyLevel}" required>
                        <option value="">Select urgency</option>
                        <option th:each="urgency : ${urgencyLevels}" th:value="${urgency}" th:text="${urgency}"></option>
                    </select>
                    <span class="field-error" th:if="${#fields.hasErrors('urgencyLevel')}" th:errors="*{urgencyLevel}"></span>
                </div>

                <div class="form-field">
                    <label for="hospitalName">Hospital name</label>
                    <input id="hospitalName" type="text" th:field="*{hospitalName}" placeholder="e.g. Toronto General" required>
                    <span class="field-error" th:if="${#fields.hasErrors('hospitalName')}" th:errors="*{hospitalName}"></span>
                </div>

                <div class="form-field full">
                    <label for="hospitalAddress">Hospital address</label>
                    <input id="hospitalAddress" type="text" th:field="*{hospitalAddress}" placeholder="Street, city, province, postal code" required>
                    <span class="field-error" th:if="${#fields.hasErrors('hospitalAddress')}" th:errors="*{hospitalAddress}"></span>
                </div>

                <div class="form-field full">
                    <label for="notes">Additional notes <small>(optional)</small></label>
                    <textarea id="notes" rows="3" th:field="*{notes}" placeholder="Any specific instructions for donors..."></textarea>
                    <span class="field-error" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></span>
                </div>
            </div>

            <div class="inline-actions" style="margin-top: 24px;">
                <button class="btn-primary" type="submit"><i class="fa-solid fa-paper-plane"></i> Submit request</button>
                <a class="btn-secondary" th:href="@{/requests/list}">Cancel</a>
            </div>
        </form>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
