<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Requests - LifeLine Blood Bank</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/pages.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Outfit:wght@400;600;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
</head>
<!--/*
  Every request, whatever its status. The pending queue filters to PENDING, so this is the only
  place an approved or rejected one stays visible.

  It also carries the resume step: an approved request that has not been fulfilled yet gets a
  "Find donors" button, which is what lets an interrupted job be picked up days later.
*/-->
<body>
<div th:replace="~{fragments/header :: header(user=${user})}"></div>

<main class="page-shell">
    <div class="page-heading">
        <div>
            <div class="eyebrow">Administration</div>
            <h1>All Requests</h1>
            <p>Every request and how it was decided, including the ones no longer in the pending queue.</p>
        </div>
        <!--/*
          Dashboard first, matching the pending queue and the account list: this page is reached
          from the dashboard, so the way back belongs here too. Pending queue is the onward step.
        */-->
        <div class="inline-actions">
            <a class="btn-secondary" th:href="@{/dashboard}">
                <i class="fa-solid fa-arrow-left"></i> Dashboard
            </a>
            <a class="btn-primary" th:href="@{/admin/pending}">
                <i class="fa-solid fa-clock"></i> Pending queue
            </a>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <section class="surface-card table-wrap">
        <table class="data-table">
            <thead>
            <tr>
                <th th:replace="~{fragments/sort :: sortable('Date', 'requestDate', ${sort}, ${dir}, '/admin/requests')}"></th>
                <th th:replace="~{fragments/sort :: sortable('Requester', 'requestedBy.fullName', ${sort}, ${dir}, '/admin/requests')}"></th>
                <th th:replace="~{fragments/sort :: sortable('Blood', 'requestedBloodGroup', ${sort}, ${dir}, '/admin/requests')}"></th>
                <th th:replace="~{fragments/sort :: sortable('Units', 'unitsNeeded', ${sort}, ${dir}, '/admin/requests')}"></th>
                <th th:replace="~{fragments/sort :: sortable('Hospital', 'hospitalName', ${sort}, ${dir}, '/admin/requests')}"></th>
                <th th:replace="~{fragments/sort :: sortable('Urgency', 'urgencyLevel', ${sort}, ${dir}, '/admin/requests')}"></th>
                <th th:replace="~{fragments/sort :: sortable('Status', 'status', ${sort}, ${dir}, '/admin/requests')}"></th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(requests)}">
                <td class="empty-state" colspan="8">
                    <i class="fa-regular fa-folder-open"></i> No requests have been raised yet.
                </td>
            </tr>
            <tr th:each="request : ${requests}">
                <td th:text="${#temporals.format(request.requestDate, 'MMM d, yyyy')}">Jul 28, 2026</td>
                <td th:text="${request.requestedBy.fullName}">Donor</td>
                <td><span class="badge badge-blood" th:text="${request.requestedBloodGroup.displayName}">A+</span></td>
                <td th:text="${request.unitsNeeded}">1</td>
                <td th:text="${request.hospitalName}">Hospital</td>
                <td th:text="${request.urgencyLevel}">HIGH</td>
                <td>
                    <!--/*
                      The status name lower-cased becomes a CSS class - badge-pending, badge-approved
                      and so on - which is how each badge gets its colour. Adding a status to the
                      enum without a matching CSS rule would leave it unstyled.
                    */-->
                    <span class="badge"
                          th:classappend="${'badge-' + #strings.toLowerCase(request.status.name())}"
                          th:text="${request.status}">PENDING</span>
                </td>
                <td>
                    <div class="inline-actions">
                        <a class="btn-secondary" th:href="@{/requests/{id}(id=${request.id}, from='all')}">View</a>
                        <!--/*
                          An APPROVED request is an unfinished job, so this offers the way back into
                          it - the same donor search that approving would have opened, with the
                          blood group and the request id already filled in.
                        */-->
                        <a class="btn-success" th:if="${request.status.name() == 'APPROVED'}"
                           th:href="@{/donor/search(bloodGroup=${request.requestedBloodGroup}, requestId=${request.id}, from='all')}">
                            <i class="fa-solid fa-magnifying-glass"></i> Find donors
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </section>

    <nav th:replace="~{fragments/pagination :: pager(${page}, ${sort}, ${dir}, '/admin/requests')}"></nav>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
