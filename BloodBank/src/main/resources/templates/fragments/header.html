<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--/*
  The navigation bar, on every page of the site.

  It takes "user" as a parameter, which every page passes as header(user=${user}). Nothing sets
  that attribute itself: CurrentUserAdvice supplies it for every controller, which is what keeps
  this bar consistent as you move around. A null user means nobody is signed in.

  The bar has three tiers, and each th:if below picks one: signed out, signed in, and administrator.
*/-->
<div class="nav_bar" th:fragment="header(user)">
    <div class="left_nav">
        <!--/*
          Both the logo and the name link home, which is what people expect of a site header - the
          name is the larger target of the two, and clicking it doing nothing reads as broken.

          Two separate anchors rather than one wrapping both, because .left_nav lays its children
          out as flex items and a single wrapper would collapse the two into one.
        */-->
        <a class="logo-link" th:href="@{/home}" title="LifeLine Blood Bank home">
            <img th:src="@{/images/logo_white.png}" alt="LifeLine Blood Bank logo">
        </a>
        <a class="brand" th:href="@{/home}" title="LifeLine Blood Bank home">
            <h2>LifeLine Blood Bank</h2>
            <span>www.lifeline.com</span>
        </a>
    </div>
    <div class="right_nav">
        <!--/*
          th:block is a tag that disappears when rendered. It exists so one th:if can govern a
          group of elements without wrapping them in a <div> that would then have to be styled.
        */-->
        <th:block th:if="${user == null}">
            <a th:href="@{/login}">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>Log In
            </a>
            <a th:href="@{/register}">
                <i class="fa-solid fa-file-pen"></i>Register
            </a>
        </th:block>

        <!--/*
          Signed in. There is no Profile link here on purpose - the welcome badge at the end of the
          bar is the way in, which keeps the row shorter.
        */-->
        <th:block th:if="${user != null}">
            <a th:href="@{/requests/list}">
                <i class="fa-solid fa-list"></i>My Requests
            </a>
            <a th:href="@{/donor/search}">
                <i class="fa-solid fa-magnifying-glass"></i>Search
            </a>
            <!--/*
              Hiding these is convenience, not security - the URLs are still there for anyone who
              types them. SecurityConfig is what actually refuses a donor who tries.
            */-->
            <a th:if="${user.role.name() == 'ADMIN'}" th:href="@{/admin/pending}">
                <i class="fa-solid fa-clock"></i>Pending
            </a>
            <a th:if="${user.role.name() == 'ADMIN'}" th:href="@{/dashboard}">
                <i class="fa-solid fa-chart-pie"></i>Dashboard
            </a>
            <!--/*
              A link now, not a form, because this no longer signs anybody out - it opens the
              confirmation page, and the POST that actually ends the session lives there.

              That page is only reachable because Spring Security's logout matches POST /logout
              alone while CSRF is enabled, so this GET falls through to AuthController.
            */-->
            <a th:href="@{/logout}">
                <i class="fa-solid fa-right-from-bracket"></i>Logout
            </a>
        </th:block>

        <!--/* Outside both blocks, so it shows either way. */-->
        <a th:href="@{/about-us}">
            <i class="fa-solid fa-circle-info"></i>About Us
        </a>

        <!--/* The welcome badge is also the link to your own profile. */-->
        <a th:if="${user != null}" class="welcome-text" th:href="@{/donor/profile}" title="View my profile">
            <i class="fa-solid fa-circle-user"></i>
            <span class="welcome-copy">
                <small>Welcome</small>
                <strong th:text="${user.fullName}">John Doe</strong>
            </span>
        </a>
    </div>
</div>
</html>
