<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- ========== HEADER FRAGMENT ========== -->
<div class="nav_bar" th:fragment="header(user)">
    <div class="left_nav">
        <!-- Logo - using Thymeleaf @{} for proper path resolution -->
        <img th:src="@{/images/logo_white.png}" alt="LifeLine Logo">
        <div class="brand">
            <h2>LifeLine Blood Bank</h2>
            <span>www.lifeline.com</span>
        </div>
    </div>
    <div class="right_nav">
        <!-- Show these links ONLY when user is NOT logged in -->
        <th:block th:if="${user == null}">
            <a th:href="@{/login}">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>Log In
            </a>
            <a th:href="@{/register}">
                <i class="fa-solid fa-file-pen"></i>Register
            </a>
        </th:block>

        <!-- Show these links when user IS logged in -->
        <th:block th:if="${user != null}">
            <a th:href="@{/donor/profile}">
                <i class="fa-solid fa-user"></i>Profile
            </a>
            <a th:href="@{/requests/list}">
                <i class="fa-solid fa-list"></i>My Requests
            </a>
            <a th:href="@{/donor/search}">
                <i class="fa-solid fa-magnifying-glass"></i>Search
            </a>
            <!-- Show admin links only if user is ADMIN -->
            <a th:if="${user.role.name() == 'ADMIN'}" th:href="@{/admin/pending}">
                <i class="fa-solid fa-clock"></i>Pending
            </a>
            <a th:if="${user.role.name() == 'ADMIN'}" th:href="@{/dashboard}">
                <i class="fa-solid fa-chart-pie"></i>Dashboard
            </a>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" style="background: none; border: none; color: white; font-weight: 600; cursor: pointer; padding: 15px 20px; font-family: 'Outfit', sans-serif; font-size: 20px;">
                    <i class="fa-solid fa-right-from-bracket" style="margin-right: 10px;"></i>Logout
                </button>
            </form>
        </th:block>

        <!-- About Us is always visible -->
        <a th:href="@{/about-us}">
            <i class="fa-solid fa-circle-info"></i>About Us
        </a>

        <!-- Welcome message (only when logged in) -->
        <span th:if="${user != null}" class="welcome-text"
              th:text="'Welcome, ' + ${user.fullName}">
        </span>
    </div>
</div>
</html>
