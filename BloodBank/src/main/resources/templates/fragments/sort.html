<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<table>
    <thead>
    <tr>
        <!--
          A sortable column heading.

            label - the visible column name
            field - the entity property to sort on; must be in the controller's whitelist
            sort  - the property currently sorted on, echoed back by the controller
            dir   - the current direction, "asc" or "desc"
            url   - the listing's own path, e.g. '/admin/donors'

          Clicking the active column flips direction; clicking any other starts it ascending.
        -->
        <th th:fragment="sortable(label, field, sort, dir, url)" class="sortable-col">
            <a th:href="@{${url}(sort=${field}, dir=${sort == field and dir == 'asc' ? 'desc' : 'asc'})}"
               th:classappend="${sort == field ? (dir == 'asc' ? 'sorted-asc' : 'sorted-desc') : ''}"
               th:text="${label}">Column</a>
        </th>
    </tr>
    <tr>
        <!--
          As above, but carries the donor search's bloodGroup filter through the link. Without it
          the first click would drop the filter and empty the results.
        -->
        <th th:fragment="sortableFiltered(label, field, sort, dir, url, bloodGroup)" class="sortable-col">
            <a th:href="@{${url}(bloodGroup=${bloodGroup}, sort=${field},
                                 dir=${sort == field and dir == 'asc' ? 'desc' : 'asc'})}"
               th:classappend="${sort == field ? (dir == 'asc' ? 'sorted-asc' : 'sorted-desc') : ''}"
               th:text="${label}">Column</a>
        </th>
    </tr>
    </thead>
</table>
</body>
</html>
