# ===============================
# TEST DATABASE (in-memory H2)
# ===============================
# Overrides the MySQL settings in application.properties so the suite runs without XAMPP.
# MySQL mode keeps the entities' MySQL-flavoured foreign key definitions valid.
spring.datasource.url=jdbc:h2:mem:bloodbank;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Each test builds only the data it needs, so the demo seed stays out of the way.
# DatabaseSeederTest turns this back on for itself.
bloodbank.seed.enabled=false
